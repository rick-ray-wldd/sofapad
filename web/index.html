<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SofaPad">
<meta name="theme-color" content="#0e1013">
<meta name="format-detection" content="telephone=no">
<title>SofaPad</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- before the stylesheet: theme and language attributes, so the first frame is drawn in the right theme (SOFA-10) -->
<script src="js/boot.js"></script>
<link rel="stylesheet" href="style.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <header class="bar">
    <button id="statusBtn" class="status" data-i18n-aria="status.aria">
      <span id="dot" class="dot"></span><span id="host"></span>
    </button>
    <span id="rtt" class="rtt"></span>
    <button id="settingsBtn" class="icon-btn" data-i18n-aria="settings.aria">⚙︎</button>
  </header>
  <div id="banner" class="banner" hidden></div>

  <main id="workspace" class="workspace">
    <section id="pad" class="pad" data-i18n-aria="pad.aria">
      <div class="pad-hint" id="padHint">
        <p data-i18n="pad.hint1"></p>
        <p data-i18n="pad.hint2"></p>
        <p data-i18n="pad.hint3"></p>
        <p data-i18n="pad.hint4"></p>
      </div>
      <div id="dragBadge" class="badge" data-i18n="pad.dragging" hidden></div>
      <div id="toast" class="toast" hidden></div>
      <div id="strip" class="strip" data-i18n-aria="pad.strip.aria"><span>⇵</span></div>

      <!-- Floating buttons: shown in landscape (full-screen pad) and while typing in portrait (D-14, D-16). -->
      <div id="fab" class="fab">
        <button id="fabStatus" class="fab-status" data-i18n-aria="status.reconnect.aria"><span id="fabDot" class="dot"></span></button>
        <button id="fabKeyboard" data-i18n-aria="fab.keyboard.aria">Aa</button>
        <button id="fabShortcuts" data-i18n-aria="fab.shortcuts.aria">⌘</button>
        <button id="fabLock" data-i18n-aria="fab.lock.aria" aria-pressed="false"></button>
        <button id="fabSettings" class="fab-landscape" data-i18n-aria="settings.aria">⚙︎</button>
        <button id="fabFullscreen" class="fab-landscape" data-i18n-aria="fab.fullscreen.aria" hidden>⛶</button>
        <button id="fabSide" class="fab-landscape fab-side" data-i18n-aria="fab.side.aria">›</button>
      </div>

      <!-- Shortcut panel: covers the pad while open, never pushes it smaller (I-13). -->
      <div id="shortcutPanel" class="panel" hidden>
        <div class="panel-head">
          <strong data-i18n="panel.title"></strong>
          <span class="spacer"></span>
          <button id="editShortcuts" class="chip" data-i18n="panel.customize"></button>
          <button id="closeShortcuts" class="icon-btn" data-i18n-aria="panel.close.aria">✕</button>
        </div>
        <div id="shortcutList" class="panel-body"></div>
      </div>
    </section>

    <!-- Portrait: under the pad. Landscape: the side panel (SOFA-8, D-48), collapsible to a full-screen pad. -->
    <section id="controls" class="controls">
      <div class="side-head" data-i18n-aria="side.aria">
        <button id="sideStatus" class="fab-status" data-i18n-aria="status.reconnect.aria"><span id="sideDot" class="dot"></span></button>
        <button id="sideKeyboard" data-i18n-aria="fab.keyboard.aria">Aa</button>
        <button id="sideLock" data-i18n-aria="fab.lock.aria" aria-pressed="false"></button>
        <button id="sideSettings" data-i18n-aria="settings.aria">⚙︎</button>
        <span class="spacer"></span>
        <button id="sideClose" data-i18n-aria="side.close.aria">‹</button>
      </div>

      <div class="buttons">
        <button id="btnLeft" class="mbtn" data-i18n="btn.left"></button>
        <button id="btnLock" class="mbtn lock" aria-pressed="false"></button>
        <button id="btnRight" class="mbtn" data-i18n="btn.right"></button>
      </div>

      <!-- The input row (SOFA-8): the box takes half the width, the cells the other half — by default the cursor pad
           (SOFA-6, D-44) and ⏎ to its right. The cells are editable like the key row (js/keyrow.js). -->
      <div class="typing">
        <textarea id="input" data-i18n-aria="input.aria" rows="1"
          autocapitalize="off" autocomplete="off" spellcheck="false" enterkeyhint="enter"></textarea>
        <button id="sendBtn" class="send" data-i18n="input.send" hidden></button>
        <div id="inputCells" class="cells" data-i18n-aria="input.cells.aria"></div>
      </div>

      <div class="key-area" id="keyArea">
        <!-- Key row: scrolls sideways; the fades with ‹ › show there is more (PKM-2-3, I-19). Landscape: a grid. -->
        <div class="keys-wrap" id="keysWrap">
        <div class="keys" id="keyStrip">
          <button id="modeBtn" class="chip mode" data-i18n-aria="mode.aria"></button>
          <button id="shortcutsBtn" class="more" data-i18n="keys.shortcuts"></button>
          <!-- the rest comes from the saved key row (js/keyrow.js, PKM-3-1 ②); ✎ at the end edits it -->
        </div>
        </div>
        <!-- landscape only: more cells after the key row -->
        <div class="side-cells" id="sideCells" data-i18n-aria="keys.side.aria"></div>
      </div>
    </section>
  </main>

  <div id="pairSheet" class="sheet" hidden>
    <div class="sheet-card">
      <h2 data-i18n="pair.title"></h2>
      <p class="muted" data-i18n="pair.help"></p>
      <input id="codeInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="••••••" data-i18n-aria="pair.code.aria">
      <button id="pairBtn" class="primary" data-i18n="pair.pair"></button>
      <button id="requestBtn" class="secondary" data-i18n="pair.request"></button>
      <p id="pairMsg" class="msg" role="status"></p>
    </div>
  </div>


  <div id="settingsSheet" class="sheet" hidden>
    <div class="sheet-card settings">
      <h2 data-i18n="set.title"></h2>
      <p id="versionLine" class="muted small version"></p>
      <!-- SOFA-10: language and theme, applied at once (js/boot.js keeps them; no reload, the connection stays) -->
      <div class="prefs">
        <span id="langName" data-i18n="set.language"></span>
        <div class="seg" id="langSeg" role="radiogroup" aria-labelledby="langName">
          <button type="button" role="radio" data-lang="auto" data-i18n="lang.auto"></button>
          <button type="button" role="radio" data-lang="en" lang="en" data-i18n="lang.en"></button>
          <button type="button" role="radio" data-lang="zh" lang="zh-Hant" data-i18n="lang.zh"></button>
        </div>
        <span id="themeName" data-i18n="set.theme"></span>
        <div class="seg" id="themeSeg" role="radiogroup" aria-labelledby="themeName">
          <button type="button" role="radio" data-theme-choice="system" data-i18n="theme.system"></button>
          <button type="button" role="radio" data-theme-choice="light" data-i18n="theme.light"></button>
          <button type="button" role="radio" data-theme-choice="dark" data-i18n="theme.dark"></button>
        </div>
      </div>
      <label><span data-i18n="set.sens"></span> <output id="sensOut"></output><input id="sens" type="range" min="0.5" max="4" step="0.1"></label>
      <label><span data-i18n="set.accel"></span> <output id="accelOut"></output><input id="accel" type="range" min="0" max="1" step="0.05"></label>
      <label><span data-i18n="set.scroll"></span> <output id="scrollOut"></output><input id="scroll" type="range" min="0.3" max="3" step="0.1"></label>
      <label class="row"><input id="reverse" type="checkbox"> <span data-i18n="set.reverse"></span></label>
      <label class="row"><input id="lefty" type="checkbox"> <span data-i18n="set.lefty"></span></label>
      <label class="row"><input id="longPress" type="checkbox"> <span data-i18n="set.longPress"></span></label>
      <label class="row"><input id="threeFinger" type="checkbox"> <span data-i18n="set.threeFinger"></span></label>
      <label class="row"><input id="pinch" type="checkbox"> <span data-i18n="set.pinch"></span></label>
      <label class="row"><input id="navFlick" type="checkbox"> <span data-i18n="set.navFlick"></span></label>
      <p id="macStatus" class="muted small mac-status"></p>
      <label class="row"><input id="hapticsOn" type="checkbox"> <span data-i18n="set.haptics"></span></label>
      <label class="row"><input id="autocorrect" type="checkbox"> <span data-i18n="set.autocorrect"></span></label>
      <label class="row"><input id="enterAfter" type="checkbox"> <span data-i18n="set.enterAfter"></span></label>
      <p class="muted small" data-i18n="set.help.modes"></p>
      <p class="muted small" data-i18n="set.help.caret"></p>
      <p class="muted small" data-i18n="set.help.landscape"></p>
      <label class="row"><input id="sidePanel" type="checkbox"> <span data-i18n="set.sidePanel"></span></label>
      <details class="io-log" id="inputLogBox">
        <summary data-i18n="set.log.summary"></summary>
        <p class="muted small" data-i18n="set.log.help"></p>
        <textarea id="inputLogText" rows="8" readonly></textarea>
        <div class="io-buttons"><button id="inputLogSelect" class="secondary" data-i18n="set.log.selectAll"></button><button id="inputLogClear" class="secondary" data-i18n="set.log.clear"></button></div>
      </details>
      <button id="rowEditBtn" class="secondary" data-i18n="set.editRows"></button>
      <button id="forgetBtn" class="secondary" data-i18n="set.forget"></button>
      <button id="closeSettings" class="primary" data-i18n="done"></button>
    </div>
  </div>

  <!-- Row editor (PKM-3-1 ②, D-28; SOFA-8): one row at a time (drag ≡ to reorder), and everything that can go on it. -->
  <div id="rowSheet" class="sheet" hidden>
    <div class="sheet-card rowedit">
      <div class="panel-head">
        <h2 data-i18n="rowed.title"></h2>
        <span class="spacer"></span>
        <button id="rowDone" class="chip" data-i18n="done"></button>
      </div>
      <div class="row-tabs" id="rowTabs" role="tablist" data-i18n-aria="rowed.tabs.aria">
        <button type="button" role="tab" data-row="input" data-i18n="rowed.tab.input"></button>
        <button type="button" role="tab" data-row="keys" data-i18n="rowed.tab.keys"></button>
        <button type="button" role="tab" data-row="side" data-i18n="rowed.tab.side"></button>
      </div>
      <p id="rowNote" class="muted small"></p>
      <ol id="rowCurrent" class="row-current"></ol>
      <div id="rowCatalog" class="row-catalog"></div>
      <div class="row-foot">
        <button id="rowAddCustom" class="secondary" data-i18n="rowed.addCustom"></button>
        <button id="rowReset" class="secondary" data-i18n="rowed.reset"></button>
      </div>
      <p id="rowMsg" class="msg" role="status"></p>
    </div>
  </div>

  <div id="editorSheet" class="sheet" hidden>
    <div class="sheet-card editor">
      <h2 data-i18n="ed.title"></h2>
      <p class="muted small" data-i18n="ed.help"></p>
      <ol id="customList" class="custom-list"></ol>
      <button id="addShortcut" class="secondary" data-i18n="ed.add"></button>

      <form id="shortcutForm" class="sc-form" hidden>
        <label><span data-i18n="ed.name"></span><input id="scLabel" maxlength="24" data-i18n-placeholder="ed.name.placeholder" autocomplete="off"></label>
        <!-- the modifier names come from MODIFIERS (js/shortcuts.js); macOS calls the keys this in every language -->
        <div class="mod-picks" id="modPicks" role="group" data-i18n-aria="ed.mods.aria"></div>
        <label><span data-i18n="ed.key"></span><select id="scKey"></select></label>
        <p class="preview"><span data-i18n="ed.preview"></span><span id="scPreview"></span></p>
        <p id="scMsg" class="msg" role="status"></p>
        <div class="row-buttons">
          <button type="button" id="scCancel" class="secondary" data-i18n="ed.cancel"></button>
          <button type="submit" id="scSave" class="primary" data-i18n="ed.save"></button>
        </div>
      </form>

      <details class="io">
        <summary data-i18n="io.summary"></summary>
        <textarea id="ioText" rows="5" spellcheck="false" data-i18n-placeholder="io.placeholder"></textarea>
        <div class="row-buttons">
          <button type="button" id="exportBtn" class="secondary" data-i18n="io.export"></button>
          <button type="button" id="importAppend" class="secondary" data-i18n="io.append"></button>
          <button type="button" id="importReplace" class="secondary"></button>
        </div>
        <p id="ioMsg" class="msg" role="status"></p>
      </details>
      <button id="closeEditor" class="primary" data-i18n="done"></button>
    </div>
  </div>

  <label id="hapticLabel" class="haptic" aria-hidden="true"><input id="hapticSwitch" type="checkbox" switch tabindex="-1"></label>
</div>
</body>
</html>
